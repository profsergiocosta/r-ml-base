# Builds, smoke-tests and publishes the image to Docker Hub.
#
#   - Pull requests / manual runs: build + smoke test only (nothing is pushed).
#   - Tag push (1.2.3 or v1.2.3):   build + smoke test + push + sync Docker Hub description.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   DOCKERHUB_USERNAME   Docker Hub user that can push to the image namespace
#   DOCKERHUB_TOKEN      Docker Hub access token (Read, Write, Delete scope: needed to
#                        update the repository description)
#
# The R packages are compiled during the build, so the first run takes a while;
# later runs reuse the GitHub Actions layer cache.

name: Docker publish

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - Dockerfile.base
      - install_packages_base.R
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

env:
  IMAGE: profsergiocosta/r-ml-base

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=sha,prefix=sha-,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Plumber image defines its own entrypoint, so Rscript is set explicitly.
      - name: Smoke test - packages load
        run: |
          docker run --rm --entrypoint Rscript "$IMAGE:test" -e '
            pkgs <- c("plumber", "kernlab", "caret", "fastshap", "dplyr",
                      "ggfittext", "gggenes", "shapviz", "randomForest")
            for (p in pkgs) {
              library(p, character.only = TRUE)
              cat(sprintf("%-14s %s\n", p, as.character(packageVersion(p))))
            }
            cat("ALL PACKAGES OK\n")' | tee out.txt
          grep -q "ALL PACKAGES OK" out.txt

      - name: Smoke test - train a model with caret
        run: |
          docker run --rm --entrypoint Rscript "$IMAGE:test" -e '
            library(caret)
            set.seed(1)
            fit <- train(Species ~ ., data = iris, method = "rf",
                         trControl = trainControl(method = "none"),
                         tuneGrid = data.frame(mtry = 2), ntree = 50)
            cat("TRAIN OK, accuracy on training data:",
                mean(predict(fit, iris) == iris$Species), "\n")' | tee out.txt
          grep -q "TRAIN OK" out.txt

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Sync Docker Hub description
        if: startsWith(github.ref, 'refs/tags/')
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: R and Plumber base image with pre-installed machine learning packages (caret, randomForest, kernlab and more)
          readme-filepath: ./README.md
